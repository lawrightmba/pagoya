<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PagoYa — 90 Day Plan</title>
<style>
  html, body {
    overflow-x: hidden;
    max-width: 100vw;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f5f5;
    color: #1a1a1a;
  }
  * { box-sizing: border-box; }

  .header {
    background: #fff;
    border-bottom: 1px solid #e0e0e0;
    padding: 0 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    max-width: 100%;
  }
  .header-title { font-size: 16px; font-weight: 700; color: #1a1a1a; }
  .sync-btn {
    background: #1D9E75;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    padding: 0 14px;
    height: 36px;
    min-width: 44px;
    cursor: pointer;
    white-space: nowrap;
  }
  .sync-btn:active { opacity: 0.8; }

  .progress-wrap {
    background: #fff;
    border-bottom: 1px solid #e0e0e0;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: 100%;
  }
  .progress-bar {
    flex: 1;
    height: 8px;
    background: #e0e0e0;
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: #1D9E75;
    border-radius: 99px;
    transition: width 0.4s ease;
    width: 0%;
  }
  .progress-label {
    font-size: 13px;
    font-weight: 600;
    color: #1D9E75;
    white-space: nowrap;
  }

  .phase-section { margin: 16px 0 0; }
  .phase-header {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .phase-title { font-size: 14px; font-weight: 700; }
  .phase-count { font-size: 12px; font-weight: 500; opacity: 0.7; }
  .ph1 { background: #EEEDFE; }
  .ph1 .phase-title, .ph1 .phase-count { color: #3C3489; }
  .ph2 { background: #E1F5EE; }
  .ph2 .phase-title, .ph2 .phase-count { color: #085041; }
  .ph3 { background: #FEF3DC; }
  .ph3 .phase-title, .ph3 .phase-count { color: #6B3D00; }

  .items-list {
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .item {
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #e8e8e8;
    max-width: 100%;
  }
  .item-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px;
    min-height: 44px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    max-width: 100%;
  }
  .item-row:active { background: #f9f9f9; }
  .item-check {
    width: 22px;
    height: 22px;
    min-width: 22px;
    min-height: 44px;
    border: 2px solid #ccc;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    cursor: pointer;
    background: #fff;
    -webkit-tap-highlight-color: transparent;
    flex-shrink: 0;
    align-self: flex-start;
  }
  .item-check.checked { background: #1D9E75; border-color: #1D9E75; }
  .item-check.checked::after {
    content: '';
    display: block;
    width: 6px;
    height: 10px;
    border: 2px solid #fff;
    border-top: none;
    border-left: none;
    transform: rotate(45deg) translate(-1px,-1px);
  }
  .item-main { flex: 1; min-width: 0; }
  .item-title { font-size: 14px; font-weight: 500; line-height: 1.4; color: #1a1a1a; word-wrap: break-word; }
  .item-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 5px; }
  .item-day { font-size: 11px; color: #999; font-weight: 500; }
  .badge-critical {
    font-size: 10px; font-weight: 700; color: #B91C1C;
    background: #FEE2E2; padding: 2px 6px; border-radius: 4px;
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .item.done .item-title { text-decoration: line-through; color: #aaa; }
  .item.done .item-row { opacity: 0.55; }
  .item-chevron { font-size: 11px; color: #ccc; margin-top: 4px; transition: transform 0.2s; flex-shrink: 0; }
  .item.open .item-chevron { transform: rotate(180deg); color: #999; }

  .item-detail {
    display: none;
    padding: 0 14px 16px 48px;
    border-top: 1px solid #f0f0f0;
    max-width: 100%;
  }
  .item.open .item-detail { display: block; }
  .detail-section { margin-top: 12px; }
  .detail-label {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: #aaa; margin-bottom: 4px;
  }
  .detail-text { font-size: 13px; color: #444; line-height: 1.6; }
  .bottom-pad { height: 48px; }
</style>
</head>

const TOTAL = ITEMS.length;
const STORAGE_KEY = 'ck_checks';

function loadChecks() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { return {}; }
}
function saveChecks(c) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(c)); } catch(e) {}
}
function updateProgress() {
  const checks = loadChecks();
  const done = ITEMS.filter(it => checks[it.id]).length;
  const pct = Math.round((done / TOTAL) * 100);
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-label').textContent = done + ' / ' + TOTAL + ' complete';
}

function toggleCheck(e, id) {
  e.stopPropagation();
  const checks = loadChecks();
  checks[id] = !checks[id];
  saveChecks(checks);
  const item = document.getElementById('item-' + id);
  const box  = document.getElementById('box-'  + id);
  if (checks[id]) { item.classList.add('done'); box.classList.add('checked'); }
  else            { item.classList.remove('done'); box.classList.remove('checked'); }
  updateProgress();
  // update phase count
  const phase = ITEMS.find(it => it.id === id).phase;
  refreshPhaseCount(phase, checks);
}

function refreshPhaseCount(phaseNum, checks) {
  const phItems = ITEMS.filter(it => it.phase === phaseNum);
  const done = phItems.filter(it => checks[it.id]).length;
  const el = document.getElementById('ph-count-' + phaseNum);
  if (el) el.textContent = done + ' / ' + phItems.length;
}

function toggleOpen(id) {
  document.getElementById('item-' + id).classList.toggle('open');
}

function syncNow() {
  const btn = document.querySelector('.sync-btn');
  btn.textContent = '... Syncing';
  btn.disabled = true;
  fetch('/api/sync').then(r => r.json()).catch(() => {}).finally(() => { location.reload(); });
}

  let html = '';

    const phItems = ITEMS.filter(it => it.phase === ph.num);

    html += '<div class="phase-section">';
    html += '<div class="phase-header ' + ph.cls + '">';
    html += '<span class="phase-title">' + ph.label + '</span>';
    html += '<span class="phase-count" id="ph-count-' + ph.num + '">' + doneCnt + ' / ' + phItems.length + '</span>';
    html += '</div><div class="items-list">';
    for (const it of phItems) {
      const isDone = !!checks[it.id];
      const doneClass = isDone ? ' done' : '';
      const checkedClass = isDone ? ' checked' : '';
      const critBadge = it.critical ? '<span class="badge-critical">Critical</span>' : '';
      html += '<div class="item' + doneClass + '" id="item-' + it.id + '">';
      html += '<div class="item-row" onclick="toggleOpen(\'' + it.id + '\')">';
      html += '<div class="item-check' + checkedClass + '" id="box-' + it.id + '" onclick="toggleCheck(event,\'' + it.id + '\')"></div>';
      html += '<div class="item-main">';
      html += '<div class="item-title">' + it.title + '</div>';
      html += '<div class="item-meta"><span class="item-day">' + it.day + '</span>' + critBadge + '</div>';
      html += '</div>';
      html += '<div class="item-chevron">\u25be</div>';
      html += '</div>';
      html += '<div class="item-detail">';
      html += '<div class="detail-section"><div class="detail-label">Why this matters</div><div class="detail-text">' + it.why + '</div></div>';
      html += '<div class="detail-section"><div class="detail-label">Specific action</div><div class="detail-text">' + it.action + '</div></div>';
      html += '<div class="detail-section"><div class="detail-label">Competitive result</div><div class="detail-text">' + it.result + '</div></div>';
      html += '</div>';
      html += '</div>';
    }
    html += '</div></div>';
  }
  container.innerHTML = html;
  updateProgress();
}

render();
</script>
</body>
</html>
