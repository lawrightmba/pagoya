kind = "video"
previewPath = "/pagoya-demo-video/"
title = "PagoYa — Pay a Bill in 2 Minutes"
version = "1.0.0"
id = "artifacts/pagoya-demo-video"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/pagoya-demo-video/" ]
localPort = 25145

[services.development]
run = "pnpm --filter @workspace/pagoya-demo-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pagoya-demo-video", "run", "build" ]
publicDir = "artifacts/pagoya-demo-video/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25145"
BASE_PATH = "/pagoya-demo-video/"
